<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cu Dem FM</title>
    <style>
      html, body, #app { min-height: 100%; margin: 0; }
      .app-loading {
        box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 24px; text-align: center;
        color: #1f2937; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f5f3ff 0%, #fff7ed 50%, #eef2ff 100%);
      }
      .app-loading__logo { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 18px; font-size: 28px; background: #fff; box-shadow: 0 8px 24px rgba(109, 40, 217, .15); }
      .app-loading h1 { margin: 16px 0 18px; font-size: 24px; font-weight: 800; color: #6d28d9; }
      .app-loading__spinner { width: 30px; height: 30px; border: 3px solid #ddd6fe; border-top-color: #7c3aed; border-radius: 50%; animation: app-loading-spin .8s linear infinite; }
      .app-loading p { margin: 16px 0 5px; font-size: 15px; font-weight: 600; }
      .app-loading span { max-width: 280px; color: #6b7280; font-size: 13px; line-height: 1.5; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading" role="status" aria-live="polite">
        <div class="app-loading__logo" aria-hidden="true">⚽</div>
        <h1>Cú Đêm</h1>
        <div class="app-loading__spinner" aria-hidden="true"></div>
        <p>Đang khởi động hệ thống...</p>
        <span>Máy chủ có thể mất một chút thời gian để thức dậy.</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
